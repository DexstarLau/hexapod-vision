name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Windows is not optional here. The print set is the deliverable, and
        # Git rewrites a PDF's line endings on a Windows checkout unless
        # .gitattributes forbids it -- neither PDF carries a NUL byte in its
        # first 8000, so Git's own heuristic calls them text. That defect is
        # invisible on Linux and invisible on the machine that made the files.
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt is the RUNNER, not the tests. The test code imports
      # only the standard library and pytest; pytest is not in the standard
      # library and setup-python does not ship it. opencv and reportlab stay
      # out of this file -- they only regenerate the print set, which is
      # committed and checksummed. See requirements-print.txt.
      - run: pip install -r requirements.txt

      # Its own named step, for the same reason MP1 calls `gcc --version`:
      # a missing runner must fail here, saying so, rather than as a bare
      # "No module named pytest" attributed to the test suite.
      - name: test runner is present
        run: python -m pytest --version

      - run: python -m pytest tests/ -v
